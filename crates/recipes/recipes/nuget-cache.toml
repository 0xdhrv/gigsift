format_version = 1
id = "nuget-cache"
name = "NuGet package cache"
platforms = ["macos", "windows"]
category = "package_cache"
action = "move_to_trash"
risk = "low"
rebuild_cost = { time = "minutes", network = "high" }

[detect]
home_paths = [{ path = ".nuget/packages" }]

[protect]
when = []
apps = ["dotnet"]

[explain]
reason = "Downloaded packages that NuGet restores on demand"
loses = "Local copies of packages"

[[regenerate]]
hint = "dotnet restore"
