format_version = 1
id = "cargo-registry-cache"
name = "Cargo registry cache"
platforms = ["macos", "windows"]
category = "package_cache"
action = "move_to_trash"
risk = "low"
rebuild_cost = { time = "minutes", network = "high" }

[detect]
home_paths = [{ path = ".cargo/registry/cache" }]

[protect]
when = []
apps = ["cargo"]

[explain]
reason = "Downloaded crate archives that Cargo fetches again on demand"
loses = "Offline copies of crates"

[[regenerate]]
hint = "cargo build"
