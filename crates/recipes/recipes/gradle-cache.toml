format_version = 1
id = "gradle-cache"
name = "Gradle dependency cache"
platforms = ["macos", "windows"]
category = "package_cache"
action = "move_to_trash"
risk = "low"
rebuild_cost = { time = "minutes", network = "high" }

[detect]
home_paths = [{ path = ".gradle/caches" }]

[protect]
when = []
apps = ["java"]

[explain]
reason = "Downloaded dependencies and build outputs shared by Gradle projects"
loses = "Local copies of dependencies, which are downloaded again on demand"

[[regenerate]]
hint = "gradle build"
