format_version = 1
id = "gradle-project"
name = "Gradle project cache"
platforms = ["macos", "windows"]
category = "build_artifact"
action = "move_to_trash"
risk = "low"
rebuild_cost = { time = "minutes", network = "low" }

[detect]
paths = ["**/.gradle"]
parent_markers = ["build.gradle", "build.gradle.kts", "settings.gradle", "settings.gradle.kts"]

[protect]
when = ["inside_active_project", "contains_git_tracked_files", "contains_untracked_work"]
apps = ["java"]

[explain]
reason = "Per-project Gradle state that the next build recreates"
loses = "Incremental build state"

[[regenerate]]
hint = "gradle build"
