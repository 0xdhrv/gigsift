format_version = 1
id = "nuxt-build"
name = "Nuxt build output"
platforms = ["macos", "windows"]
category = "build_artifact"
action = "move_to_trash"
risk = "low"
rebuild_cost = { time = "minutes", network = "none" }

[detect]
paths = ["**/.nuxt"]
parent_markers = ["package.json"]

[protect]
when = ["inside_active_project", "contains_git_tracked_files", "contains_untracked_work"]

[explain]
reason = "Generated files that Nuxt writes on every run"
loses = "Generated app files and types"

[[regenerate]]
hint = "nuxt prepare"
