[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/0xdhrv/gigsift"

[workspace.dependencies]
gigsift-core = { path = "crates/core", version = "0.1.0" }
gigsift-engine = { path = "crates/engine", version = "0.1.0" }
gigsift-platform-macos = { path = "crates/platform-macos", version = "0.1.0" }
gigsift-platform-windows = { path = "crates/platform-windows", version = "0.1.0" }
gigsift-recipes = { path = "crates/recipes", version = "0.1.0" }
gigsift-scanner = { path = "crates/scanner", version = "0.1.0" }
gigsift-store = { path = "crates/store", version = "0.1.0" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
jiff = { version = "0.2", features = ["serde"] }
jsonschema = { version = "0.60", default-features = false }
libc = "0.2"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }
rayon = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
tempfile = "3"
thiserror = "2"
toml = "1"
ulid = "1"
windows = "0.62"
windows-core = "0.62"
windows-sys = "0.61"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
